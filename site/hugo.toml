# Introducemyself 사이트 설정 (테마: CareerCanvas)
# 개인 정보 항목은 "내 정보" 표시가 있는 곳만 수정하면 됩니다.

baseURL = "https://hyangnamdexter.github.io/Introducemyself/"
title = "이승환"

defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = false

# 태그·분류 페이지는 쓰지 않으므로 만들지 않음
disableKinds = ["taxonomy", "term"]

[languages]
  [languages.ko]
    contentDir = "content/ko"
    label = "한국어"
    locale = "ko-KR"
    weight = 1
    [languages.ko.params]
      # 내 정보: 이름 아래 번갈아 나오는 문장 (마침표+공백으로 구분)
      tagline = "네트워크에 관심 있는 학생입니다. nextlab에서 Intent Caching을 연구합니다."
      # 내 정보: 상단 짧은 소개
      hero_description = "안녕하세요. 전북대학교 nextlab에서 Intent Caching에 대해 연구하고 있는 학생입니다."
      # 내 정보: 지역 (비우면 표시하지 않음)
      hero_location = "화성, 경기도"
      collab_tags = []

[build]
  writeStats = true

[params]
  # 내 정보: 이름
  name = "이승환"
  # 이름 아래에 작게 표시하는 영문 이름
  name_en = "Seunghwan Lee"
  firstName = "이승환"
  lastName = ""
  # 내 정보: 공개 이메일 (비우면 표시하지 않음)
  email = "a031122@jbnu.ac.kr"
  # 내 정보: site/static/images/ 아래 파일 (앞에 / 를 붙이지 않음)
  profile_image = "images/profile.jpg"
  profile_alt = "식당에서 휴대폰을 보고 있는 이승환"
  author = "이승환"
  description = "전북대학교 IT지능정보공학과 이승환의 개인 소개 사이트"
  github_url = "https://github.com/HyangnamDexter"
  github_text = "github.com/HyangnamDexter"
  # 테마 스크립트가 읽는 값. 비워 두면 문의 폼·Pexels 사진을 쓰지 않음
  formspreeendpoint = ""
  pexelsapikey = ""
  # 상단 "활동 자세히 보기" 버튼이 여는 대표 활동 페이지
  activity_url = "activities/personal-website/"

  [[params.social]]
    icon = "github"
    label = "GitHub"
    url = "https://github.com/HyangnamDexter"


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']

# 페이지를 열 때마다 아래 색상 조합 중 하나가 무작위로 적용됩니다.
[params.color_palettes]
  [[params.color_palettes.palette]]
    name = "professional"
    main_color = "#474A51"
    second_color = "#E52521"
    third_color = "#3CB043"
  [[params.color_palettes.palette]]
    name = "ocean"
    main_color = "#1E40AF"
    second_color = "#06B6D4"
    third_color = "#10B981"
  [[params.color_palettes.palette]]
    name = "steel"
    main_color = "#374151"
    second_color = "#6B7280"
    third_color = "#10B981"
  [[params.color_palettes.palette]]
    name = "slate"
    main_color = "#475569"
    second_color = "#0EA5E9"
    third_color = "#F97316"

# pexelsapikey가 비어 있으면 사진 대신 테마의 그라데이션 배경을 사용합니다. (테마가 queries 값을 필수로 검사함)
[params.pexels]
  queries = ["sky and clouds"]

# 상단 메뉴: "#아이디"는 홈 화면의 섹션으로 이동합니다.
[menus]
  [[menus.main]]
    name = "소개"
    url = "#about"
    weight = 1
  [[menus.main]]
    name = "역량"
    url = "#skills"
    weight = 2
  [[menus.main]]
    name = "활동"
    url = "#experience"
    weight = 3
  [[menus.main]]
    name = "기술"
    url = "#technical"
    weight = 4
  [[menus.main]]
    name = "연락처"
    url = "#contact"
    weight = 5
