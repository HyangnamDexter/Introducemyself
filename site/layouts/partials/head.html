
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- 🔖 Dynamic title: "<이름> | 개인 소개" on home, "<페이지> | <이름>" elsewhere -->
{{ $siteName := .Site.Params.name | default .Site.Title }}
<title>{{ if .IsHome }}{{ $siteName }} | 개인 소개{{ else }}{{ .Title }} | {{ $siteName }}{{ end }}</title>

<!-- ✅ Meta tags -->
<meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta name="author" content="{{ .Site.Params.author | default .Site.Params.name }}" />
<link rel="canonical" href="{{ .Permalink }}" />

<!-- 🌐 Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }} | {{ .Site.Params.tagline }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}" />
<meta property="og:description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:image" content="{{ with .Params.og_image }}{{ . | absURL }}{{ else }}{{ with site.Params.og_image }}{{ . | absURL }}{{ end }}{{ end }}">
<meta property="og:image:width" content="640" />
<meta property="og:image:height" content="640" />
<meta property="og:site_name" content="{{ .Site.Title }}" />

<!-- 🐦 Twitter Card -->
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }} | {{ .Site.Params.tagline }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}" />
<meta name="twitter:description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta name="twitter:image" content="{{ with .Params.og_image }}{{ . | absURL }}{{ else }}{{ with site.Params.og_image }}{{ . | absURL }}{{ end }}{{ end }}" />

<!-- 🔧 Favicon -->
{{/* Favicon inside the project path; without an explicit icon browsers
     request /favicon.ico from the domain root, outside this project site. */}}
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}" />

<!-- Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
